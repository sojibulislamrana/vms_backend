spring.application.name=vms_backend_test

# Isolated test database located in target/ so development database vms.db is never polluted
spring.datasource.url=jdbc:sqlite:target/test-vms.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

