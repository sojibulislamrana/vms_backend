spring.application.name=vms_backend
server.port=${PORT:8080}

# ==============================================================================
# Database Connectivity Configuration (Environment-driven)
# Credentials and URLs are injected via environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER
# Default: local SQLite for zero-setup execution.
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:sqlite:vms.db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}

# Spring Data JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
