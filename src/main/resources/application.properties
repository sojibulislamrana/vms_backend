spring.application.name=vms_backend
server.port=${PORT:8080}

# ==============================================================================
# Database Connectivity Configuration (Environment-driven)
# Supports DB_URL or Render's default DATABASE_URL:
#   DB_URL, DATABASE_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER
# Default: local SQLite for zero-setup execution.
# ==============================================================================
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:sqlite:vms.db}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:}

# Spring Data JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ==============================================================================
# CORS Configuration (Production vs Development)
# Override in Render Environment Variables with your Flutter Web domain:
# e.g. CORS_ALLOWED_ORIGINS=https://6aeb38944ca4e112c1ce93cc--stark-vms-forntend.netlify.app
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.netlify.app,https://6aeb38944ca4e112c1ce93cc--stark-vms-forntend.netlify.app,https://*.onrender.com,https://*.pages.dev,https://*.vercel.app}
